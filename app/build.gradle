plugins {
    id 'com.android.application'
}

def requestedAbis = providers.gradleProperty('g1Abis').orElse('arm64-v8a').get().split(',').toList()
def debugAbis = providers.gradleProperty('g1DebugAbis').orElse(requestedAbis.join(',')).get().split(',').toList()
if ([requestedAbis, debugAbis].any { abis -> abis.isEmpty() || abis.any { !['arm64-v8a', 'x86_64'].contains(it) } }) {
    throw new GradleException('g1Abis and g1DebugAbis must contain arm64-v8a and/or x86_64, separated by a comma.')
}

android {
    namespace 'com.iammrmikeman.g1awakening'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.iammrmikeman.g1awakening'
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName '0.1.2-dev'
        externalNativeBuild {
            cmake {
                targets 'g1awakening'
                // Match the native API floor to Android 12, the oldest supported OS.
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                        '-DANDROID_PLATFORM=android-31'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            ndk {
                abiFilters.addAll(debugAbis)
            }
        }
        release {
            minifyEnabled false
            ndk {
                abiFilters.addAll(requestedAbis)
            }
            // Production signing must use the maintainer's private key outside this repository.
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ['big', 'bin', 'mp4', 'png', 'json']
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

// Source-only CI can compile and lint without redistributing game data. An
// installable APK/AAB, however, must contain the complete pinned iOS package.
// Run every time: file timestamps are not proof that resource bytes are intact.
def verifyGameAssets = tasks.register('verifyGameAssets', Exec) {
    group = 'verification'
    description = 'Verify the authoritative iOS source and all 98 packaged game resources.'
    workingDir rootProject.projectDir
    commandLine providers.gradleProperty('g1Python').orElse('python3').get(),
            rootProject.file('tools/verify_port.py').absolutePath, '--require-assets'
}

android.applicationVariants.all { variant ->
    def variantName = variant.name.capitalize()
    tasks.matching { task ->
        task.name == "package${variantName}" || task.name == "package${variantName}Bundle"
    }.configureEach {
        dependsOn verifyGameAssets
    }
}
